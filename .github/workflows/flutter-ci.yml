name: flutter-ci

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android (debug, no signing needed)
        run: flutter build apk --debug

# NOTE: this file is for LOCAL DEVELOPMENT ONLY. The backend service below runs the
# 'dev' profile with dev credentials on purpose. For production, run with
# SPRING_PROFILES_ACTIVE=prod and real secrets from your secret manager - the app
# refuses to start in prod with the dev defaults (see ProductionConfigValidator).
services:
  postgres:
    image: postgres:16-alpine
    container_name: teacheros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teacheros
      POSTGRES_USER: teacheros
      POSTGRES_PASSWORD: teacheros
    ports:
      - "5433:5432"
    volumes:
      - teacheros_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacheros"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev. The backend talks to this
  # via the same S3 API it will use against AWS S3 / Cloudflare R2 /
  # DigitalOcean Spaces in production - switching providers later is a
  # config change (endpoint + credentials), not a code change.
  minio:
    image: minio/minio:latest
    container_name: teacheros-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teacheros
      MINIO_ROOT_PASSWORD: teacheros123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001) - useful for eyeballing uploaded files during dev
    volumes:
      - teacheros_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teacheros-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: teacheros-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/teacheros
      # App connects as a non-superuser so row-level security is enforced.
      DB_USERNAME: teacheros_app
      DB_PASSWORD: teacheros_app
      # Flyway runs migrations as the table owner.
      FLYWAY_USER: teacheros
      FLYWAY_PASSWORD: teacheros
      REDIS_HOST: redis
      RATE_LIMIT_PROVIDER: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: teacheros
      STORAGE_SECRET_KEY: teacheros123
      STORAGE_BUCKET: teacheros-study-material
    ports:
      - "8080:8080"

volumes:
  teacheros_postgres_data:
  teacheros_minio_data:

# ---------------------------------------------------------------------------
# Core / shared config only. Everything module-specific lives in
# config/modules/<module>.yml and is pulled in via spring.config.import below.
#
# Adding a module's config: create config/modules/<module>.yml, add ONE line
# to the import list. Edit only your own file after that.
# Environment-specific overrides stay in application-dev.yml / -prod.yml.
# ---------------------------------------------------------------------------
spring:
  application:
    name: teacheros-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import:
      - classpath:config/modules/ai.yml
      - classpath:config/modules/auth.yml
      - classpath:config/modules/notifications.yml
      - classpath:config/modules/payments.yml
      - classpath:config/modules/storage.yml
      - classpath:config/modules/public.yml
      - classpath:config/modules/security.yml

  # --- core: database ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teacheros}
    username: ${DB_USERNAME:teacheros}
    password: ${DB_PASSWORD:teacheros}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is ALWAYS managed by Flyway migrations, never by Hibernate.
      # This must never be "update" or "create" in any environment.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# --- core: app-wide ---
app:
  timezone: Asia/Kolkata

  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    fee-cron: "${REMINDERS_FEE_CRON:0 0 9 * * *}"
    attendance-cron: "${REMINDERS_ATTENDANCE_CRON:0 0 18 * * *}"
    days-before-due: ${REMINDERS_DAYS_BEFORE_DUE:2}
    low-attendance-threshold: ${REMINDERS_LOW_ATTENDANCE_THRESHOLD:75}

  video:
    provider: ${VIDEO_PROVIDER:log}

# --- core: server / ops ---
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Set to "framework" in prod behind a proxy so the rate limiter sees the real client IP.
  # (Was wrongly nested under `app:` in the old file - it must be under `server:`.)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n"



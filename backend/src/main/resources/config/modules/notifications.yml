# Module: notifications (SMS + email alerts). SMS config is also used for OTP
# delivery when app.otp.delivery-mode=sms (see auth.yml).

spring:
  # Only used when app.email.provider=smtp. Left at harmless localhost
  # defaults otherwise since SmtpEmailSender isn't even instantiated
  # (@ConditionalOnProperty) when provider=log.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  sms:
    # "log" (dev default) prints alert SMS instead of sending them.
    # "twilio" sends real SMS via Twilio - also used for OTP delivery
    # when app.otp.delivery-mode=sms, sharing the same Twilio account.
    provider: ${SMS_PROVIDER:log}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  email:
    # "log" (dev default) prints emails instead of sending them.
    # "smtp" sends real email via Spring Mail - works with SES, SendGrid,
    # Postmark, or a Gmail relay, depending on the host/port/credentials.
    provider: ${EMAIL_PROVIDER:log}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@teacheros.app}

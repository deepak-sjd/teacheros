spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  flyway:
    # Migrations run as the table owner; the app itself connects as a non-superuser so RLS applies.
    user: ${FLYWAY_USER:${DB_USERNAME:teacheros}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:teacheros}}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teacheros}

app:
  security:
    rls:
      enabled: true
    rate-limit:
      provider: ${RATE_LIMIT_PROVIDER:memory}   # redis | memory (prod must be redis)
      fail-open: true                           # general API limiter only; OTP limiter always fails closed
      window-seconds: 60
      ip-per-window: 300
      user-per-window: 600
      auth-per-window: 60
      enquiry-per-window: 10
      webhook-per-window: 120
      enquiry-path: /api/v1/public/enquiries
      webhook-path-prefix: /api/v1/payments/webhook   # set to the real webhook path from the baseline

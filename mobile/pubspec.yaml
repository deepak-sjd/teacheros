name: teacheros
description: TeacherOS - teacher app for attendance and fee tracking.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage - tokens must never sit in plain SharedPreferences
  flutter_secure_storage: ^9.2.2

  # Immutable model helpers (used sparingly, not for everything)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
